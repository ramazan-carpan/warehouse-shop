<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Shop Admin</h1>
  <p class="tagline"><a class="retail" href="index.html">← View shop</a></p>
</header>

<!-- Login -->
<section id="loginView" class="notice" hidden>
  <form class="dlg" id="loginForm" style="padding:0">
    <label>Email <input type="email" id="email" required autocomplete="username"></label>
    <label>Password <input type="password" id="password" required autocomplete="current-password"></label>
    <p class="msg" id="loginMsg"></p>
    <div class="actions"><button class="btn" type="submit">Log in</button></div>
  </form>
</section>

<!-- Products -->
<section id="adminView" hidden>
  <div class="tools">
    <button class="btn" id="addBtn">+ Add product</button>
    <input type="search" id="search" placeholder="Search…" aria-label="Search products">
    <button class="btn ghost" id="logoutBtn">Log out</button>
  </div>
  <main id="grid"></main>
</section>

<p class="notice" id="setupMsg" hidden>Not connected yet. Add your Supabase URL and anon key in <code>config.js</code>.</p>

<dialog id="editDialog">
  <form class="dlg" id="editForm">
    <h2 id="editTitle">Add product</h2>
    <img id="photoPreview" alt="" style="width:100%;height:180px;object-fit:contain;border-radius:10px;background:var(--line)">
    <label>Photo
      <input type="file" id="photo" accept="image/*">
    </label>
    <label>Name <input type="text" id="name" required></label>
    <div class="two">
      <label>My price <input type="number" id="price" min="0" step="0.01" inputmode="decimal" required></label>
      <label>Retail price <input type="number" id="retailPrice" min="0" step="0.01" inputmode="decimal" placeholder="optional"></label>
    </div>
    <label>Retail link <input type="url" id="retailUrl" placeholder="https://… (optional)"></label>
    <label>Category <input type="text" id="category" list="categories" placeholder="optional"></label>
    <datalist id="categories"></datalist>
    <label>Description <textarea id="note" rows="3" maxlength="300" placeholder="Short description, e.g. brand new in box, size M, 2 colours available (optional)"></textarea></label>
    <label class="check"><input type="checkbox" id="visible" checked> Show in shop</label>
    <p class="msg" id="editMsg"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="deleteBtn">Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
  const BUCKET = "product-images";
  const db = getDb();
  const $ = id => document.getElementById(id);
  let PRODUCTS = [];
  let editing = null;   // product being edited, or null when adding
  let newPhoto = null;  // resized Blob waiting to upload

  async function init() {
    if (!db) { $("setupMsg").hidden = false; return; }
    const { data } = await db.auth.getSession();
    showView(!!data.session);
    db.auth.onAuthStateChange((_e, session) => showView(!!session));
  }

  function showView(loggedIn) {
    $("loginView").hidden = loggedIn;
    $("adminView").hidden = !loggedIn;
    if (loggedIn) load();
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginMsg").textContent = "";
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(), password: $("password").value });
    if (error) $("loginMsg").textContent = error.message;
  });
  $("logoutBtn").addEventListener("click", () => db.auth.signOut());

  async function load() {
    const { data, error } = await db.from("products").select("*").order("created_at", { ascending: false });
    if (error) { $("grid").innerHTML = `<p class="empty">${esc(error.message)}</p>`; return; }
    PRODUCTS = data;
    $("categories").innerHTML = [...new Set(data.map(p => p.category).filter(Boolean))]
      .sort().map(c => `<option value="${esc(c)}">`).join("");
    render();
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const items = PRODUCTS.filter(p => !q || p.name.toLowerCase().includes(q));
    $("grid").innerHTML = items.length ? items.map(p => `
      <article class="card${p.visible ? "" : " hidden"}">
        <img src="${esc(p.image_url || PLACEHOLDER)}" alt="${esc(p.name)}" loading="lazy">
        <div class="body">
          <div class="name">${esc(p.name)}</div>
          ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
          ${p.visible ? "" : '<div class="badge">Hidden from shop</div>'}
          ${retailLink(p)}
          <div class="row">
            <span class="price">${fmt(p.price)}</span>
            <button class="btn ghost small" data-id="${p.id}">Edit</button>
          </div>
        </div>
      </article>`).join("")
      : '<p class="empty">No products yet. Tap “+ Add product”.</p>';
  }
  $("search").addEventListener("input", render);

  $("grid").addEventListener("click", e => {
    const b = e.target.closest("button[data-id]");
    if (b) openEditor(PRODUCTS.find(p => p.id === b.dataset.id));
  });
  $("addBtn").addEventListener("click", () => openEditor(null));
  $("cancelBtn").addEventListener("click", () => $("editDialog").close());

  function openEditor(p) {
    editing = p; newPhoto = null;
    $("editForm").reset();
    $("editTitle").textContent = p ? "Edit product" : "Add product";
    $("deleteBtn").hidden = !p;
    $("editMsg").textContent = "";
    $("photoPreview").src = p?.image_url || PLACEHOLDER;
    $("name").value = p?.name ?? "";
    $("price").value = p?.price ?? "";
    $("retailPrice").value = p?.retail_price ?? "";
    $("retailUrl").value = p?.retail_url ?? "";
    $("category").value = p?.category ?? "";
    $("note").value = p?.note ?? "";
    $("visible").checked = p ? p.visible : true;
    $("editDialog").showModal();
  }

  // Shrink phone photos (often 3–5 MB) to ~200 KB so the shop loads fast.
  function resizeImage(file, max = 1200) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Could not read photo")), "image/jpeg", 0.82);
      };
      img.onerror = () => reject(new Error("This photo format is not supported. Try a JPG or PNG."));
      img.src = URL.createObjectURL(file);
    });
  }

  $("photo").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    $("editMsg").textContent = "";
    try {
      newPhoto = await resizeImage(file);
      $("photoPreview").src = URL.createObjectURL(newPhoto);
    } catch (err) {
      newPhoto = null;
      $("editMsg").textContent = err.message;
    }
  });

  $("editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const save = $("saveBtn");
    save.disabled = true; save.textContent = "Saving…";
    $("editMsg").textContent = "";
    try {
      const row = {
        name: $("name").value.trim(),
        price: Number($("price").value),
        retail_price: $("retailPrice").value === "" ? null : Number($("retailPrice").value),
        retail_url: $("retailUrl").value.trim() || null,
        category: $("category").value.trim() || null,
        note: $("note").value.trim() || null,
        visible: $("visible").checked,
      };
      let oldPath = null;
      if (newPhoto) {
        const path = `${crypto.randomUUID()}.jpg`;
        const up = await db.storage.from(BUCKET).upload(path, newPhoto, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        row.image_path = path;
        row.image_url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        oldPath = editing?.image_path;
      }
      const res = editing
        ? await db.from("products").update(row).eq("id", editing.id)
        : await db.from("products").insert(row);
      if (res.error) throw res.error;
      if (oldPath) await db.storage.from(BUCKET).remove([oldPath]);
      $("editDialog").close();
      load();
    } catch (err) {
      $("editMsg").textContent = "Could not save: " + err.message;
    } finally {
      save.disabled = false; save.textContent = "Save";
    }
  });

  $("deleteBtn").addEventListener("click", async () => {
    if (!editing || !confirm(`Delete "${editing.name}"?`)) return;
    const { error } = await db.from("products").delete().eq("id", editing.id);
    if (error) { $("editMsg").textContent = "Could not delete: " + error.message; return; }
    if (editing.image_path) await db.storage.from(BUCKET).remove([editing.image_path]);
    $("editDialog").close();
    load();
  });

  init();
</script>
</body>
</html>
