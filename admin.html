<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow">Admin</p>
    <h1>Manage products</h1>
    <p class="tagline"><a href="index.html">← View shop</a></p>
  </div>
</header>

<!-- Login -->
<section id="loginView" class="notice" hidden>
  <form class="dlg" id="loginForm" style="padding:0">
    <h2>Log in</h2>
    <label>Email <input type="email" id="email" required autocomplete="username"></label>
    <label>Password <input type="password" id="password" required autocomplete="current-password"></label>
    <p class="msg" id="loginMsg"></p>
    <div class="actions"><button class="btn" type="submit">Log in</button></div>
  </form>
</section>

<!-- Products -->
<section id="adminView" hidden>
  <div class="toolbar">
    <div class="wrap">
      <div class="toolrow">
        <button class="btn" id="addBtn">+ Add product</button>
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Search…" aria-label="Search products">
        </div>
        <button class="btn ghost" id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>
  <main class="grid" id="grid"></main>
</section>

<p class="notice" id="setupMsg" hidden>Not connected yet. Add your Supabase URL and anon key in <code>config.js</code>.</p>

<dialog id="editDialog">
  <form class="dlg" id="editForm">
    <h2 id="editTitle">Add product</h2>
    <div class="photos" id="photos"></div>
    <div class="photo-btns">
      <label class="btn ghost" id="camBtn">📷 Take photo
        <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      </label>
      <label class="btn ghost" id="pickBtn">🖼️ Choose photos
        <input type="file" id="pickInput" accept="image/*" multiple hidden>
      </label>
    </div>
    <p class="hint" id="photoHint"></p>
    <label>Name <input type="text" id="name" required></label>
    <div class="two">
      <label>My price <input type="number" id="price" min="0" step="0.01" inputmode="decimal" required></label>
      <label>Retail price <input type="number" id="retailPrice" min="0" step="0.01" inputmode="decimal" placeholder="optional"></label>
    </div>
    <label>Retail link <input type="url" id="retailUrl" placeholder="https://… (optional)"></label>
    <label>Category <input type="text" id="category" list="categories" placeholder="optional"></label>
    <datalist id="categories"></datalist>
    <label>Description <textarea id="note" rows="3" maxlength="300" placeholder="Short description, e.g. brand new in box, size M, 2 colours available (optional)"></textarea></label>
    <label class="check"><input type="checkbox" id="visible" checked> Show in shop</label>
    <p class="msg" id="editMsg"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="deleteBtn">Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
  const BUCKET = "product-images";
  const db = getDb();
  const $ = id => document.getElementById(id);
  let PRODUCTS = [];
  let editing = null;   // product being edited, or null when adding
  const MAX_PHOTOS = 5;
  // Photos in the editor, cover first: saved ones are { path, url }, new ones { blob, url }.
  let photos = [];

  async function init() {
    if (!db) { $("setupMsg").hidden = false; return; }
    const { data } = await db.auth.getSession();
    showView(!!data.session);
    db.auth.onAuthStateChange((_e, session) => showView(!!session));
  }

  function showView(loggedIn) {
    $("loginView").hidden = loggedIn;
    $("adminView").hidden = !loggedIn;
    if (loggedIn) load();
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginMsg").textContent = "";
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(), password: $("password").value });
    if (error) $("loginMsg").textContent = error.message;
  });
  $("logoutBtn").addEventListener("click", () => db.auth.signOut());

  async function load() {
    const { data, error } = await db.from("products").select("*").order("created_at", { ascending: false });
    if (error) { $("grid").innerHTML = `<p class="empty">${esc(error.message)}</p>`; return; }
    PRODUCTS = data;
    $("categories").innerHTML = [...new Set(data.map(p => p.category).filter(Boolean))]
      .sort().map(c => `<option value="${esc(c)}">`).join("");
    render();
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const items = PRODUCTS.filter(p => !q || p.name.toLowerCase().includes(q));
    $("grid").innerHTML = items.length ? items.map(p => {
      const pics = photosOf(p);
      return `<article class="card${p.visible ? "" : " hidden"}" data-id="${p.id}">
        <div class="media">
          <img src="${esc(pics[0]?.url || PLACEHOLDER)}" alt="${esc(p.name)}" loading="lazy">
          ${pics.length > 1 ? `<span class="pics">${pics.length} photos</span>` : ""}
        </div>
        <div class="body">
          <div class="name">${esc(p.name)}</div>
          ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
          ${p.visible ? "" : '<div class="badge">Hidden from shop</div>'}
          ${retailLink(p)}
          <div class="row">
            <span class="price">${fmt(p.price)}</span>
            <button class="btn ghost small" data-id="${p.id}">Edit</button>
          </div>
        </div>
      </article>`;
    }).join("") : '<p class="empty">No products yet. Tap “+ Add product”.</p>';
  }
  $("search").addEventListener("input", render);

  $("grid").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const card = e.target.closest(".card");
    if (card) openEditor(PRODUCTS.find(p => p.id === card.dataset.id));
  });
  $("addBtn").addEventListener("click", () => openEditor(null));
  $("cancelBtn").addEventListener("click", () => $("editDialog").close());

  function openEditor(p) {
    editing = p;
    photos.forEach(ph => ph.blob && URL.revokeObjectURL(ph.url));
    photos = p ? photosOf(p).map(ph => ({ path: ph.path, url: ph.url })) : [];
    renderPhotos();
    $("editForm").reset();
    $("editTitle").textContent = p ? "Edit product" : "Add product";
    $("deleteBtn").hidden = !p;
    $("editMsg").textContent = "";
    $("name").value = p?.name ?? "";
    $("price").value = p?.price ?? "";
    $("retailPrice").value = p?.retail_price ?? "";
    $("retailUrl").value = p?.retail_url ?? "";
    $("category").value = p?.category ?? "";
    $("note").value = p?.note ?? "";
    $("visible").checked = p ? p.visible : true;
    $("editDialog").showModal();
  }

  // Shrink phone photos (often 3–5 MB) to ~200 KB so the shop loads fast.
  function resizeImage(file, max = 1200) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Could not read photo")), "image/jpeg", 0.82);
      };
      img.onerror = () => reject(new Error("This photo format is not supported. Try a JPG or PNG."));
      img.src = URL.createObjectURL(file);
    });
  }

  function renderPhotos() {
    $("photos").innerHTML = photos.length ? photos.map((ph, i) => `
      <div class="thumb${i ? "" : " cover"}">
        <img src="${esc(ph.url)}" alt="Photo ${i + 1}" data-i="${i}" title="Make cover photo">
        <button type="button" class="x" data-x="${i}" aria-label="Remove photo">×</button>
        ${i ? "" : "<em>Cover</em>"}
      </div>`).join("")
      : '<div class="photo-empty">No photos yet</div>';
    const full = photos.length >= MAX_PHOTOS;
    $("camBtn").classList.toggle("disabled", full);
    $("pickBtn").classList.toggle("disabled", full);
    $("photoHint").textContent = full
      ? `Maximum ${MAX_PHOTOS} photos. Remove one to add another.`
      : `Up to ${MAX_PHOTOS} photos.` + (photos.length > 1 ? " Tap a photo to make it the cover." : "");
  }

  $("photos").addEventListener("click", e => {
    const x = e.target.dataset.x, i = e.target.dataset.i;
    if (x !== undefined) {
      const [ph] = photos.splice(+x, 1);
      if (ph.blob) URL.revokeObjectURL(ph.url);
    } else if (i !== undefined && +i > 0) {
      photos.unshift(...photos.splice(+i, 1));
    } else return;
    renderPhotos();
  });

  async function addFiles(e) {
    const files = [...e.target.files];
    e.target.value = "";  // so the same photo can be picked again
    $("editMsg").textContent = "";
    for (const file of files) {
      if (photos.length >= MAX_PHOTOS) {
        $("editMsg").textContent = `Only ${MAX_PHOTOS} photos per product.`;
        break;
      }
      try {
        const blob = await resizeImage(file);
        photos.push({ blob, url: URL.createObjectURL(blob) });
      } catch (err) {
        $("editMsg").textContent = err.message;
      }
      renderPhotos();
    }
  }
  $("camInput").addEventListener("change", addFiles);
  $("pickInput").addEventListener("change", addFiles);

  $("editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const save = $("saveBtn");
    save.disabled = true; save.textContent = "Saving…";
    $("editMsg").textContent = "";
    const uploaded = [];  // new files, removed again if saving fails
    try {
      const row = {
        name: $("name").value.trim(),
        price: Number($("price").value),
        retail_price: $("retailPrice").value === "" ? null : Number($("retailPrice").value),
        retail_url: $("retailUrl").value.trim() || null,
        category: $("category").value.trim() || null,
        note: $("note").value.trim() || null,
        visible: $("visible").checked,
      };
      const images = [];
      for (const ph of photos) {
        if (!ph.blob) { images.push({ path: ph.path, url: ph.url }); continue; }
        const path = `${crypto.randomUUID()}.jpg`;
        const up = await db.storage.from(BUCKET).upload(path, ph.blob, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        uploaded.push(path);
        images.push({ path, url: db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl });
      }
      row.images = images;
      row.image_path = images[0]?.path ?? null;
      row.image_url = images[0]?.url ?? null;
      const res = editing
        ? await db.from("products").update(row).eq("id", editing.id)
        : await db.from("products").insert(row);
      if (res.error) throw res.error;
      // Delete photos that were removed from this product.
      const keep = new Set(images.map(i => i.path));
      const gone = editing ? photosOf(editing).map(i => i.path).filter(p => p && !keep.has(p)) : [];
      if (gone.length) await db.storage.from(BUCKET).remove(gone);
      $("editDialog").close();
      load();
    } catch (err) {
      if (uploaded.length) await db.storage.from(BUCKET).remove(uploaded);
      $("editMsg").textContent = /'images' column/.test(err.message)
        ? "Database needs the photos update: run the \"images\" line from setup.sql in Supabase."
        : "Could not save: " + err.message;
    } finally {
      save.disabled = false; save.textContent = "Save";
    }
  });

  $("deleteBtn").addEventListener("click", async () => {
    if (!editing || !confirm(`Delete "${editing.name}"?`)) return;
    const { error } = await db.from("products").delete().eq("id", editing.id);
    if (error) { $("editMsg").textContent = "Could not delete: " + error.message; return; }
    const paths = photosOf(editing).map(i => i.path).filter(Boolean);
    if (paths.length) await db.storage.from(BUCKET).remove(paths);
    $("editDialog").close();
    load();
  });

  init();
</script>
</body>
</html>
