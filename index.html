<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Warehouse Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <span class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M8 20v-6h8v6"/></svg></span><span id="brandName"></span></span>
    <span class="pill">Staff only</span>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="banner">
      <h1 id="shopName"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="toolrow">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search products…" aria-label="Search products">
      </div>
    </div>
    <div class="chips" id="chips" hidden></div>
    <p class="count" id="count"></p>
  </div>
</div>

<main class="grid" id="grid">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<p class="footer" id="footer"></p>

<dialog id="viewDialog" class="view">
  <button type="button" class="close" id="closeView" aria-label="Close">×</button>
  <div class="view-grid">
    <div class="gallery">
      <div class="slides" id="slides"></div>
      <button type="button" class="nav prev" id="prev" aria-label="Previous photo">‹</button>
      <button type="button" class="nav next" id="next" aria-label="Next photo">›</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="view-body" id="viewBody"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let PRODUCTS = [];
  let category = "";

  document.title = SHOP.name;
  $("shopName").textContent = SHOP.name;
  $("brandName").textContent = SHOP.name;
  $("footer").textContent = `© ${new Date().getFullYear()} ${SHOP.name}`;
  $("tagline").textContent = SHOP.tagline;

  async function load() {
    const db = getDb();
    if (!db) {
      $("grid").innerHTML = '<p class="empty">Shop is not connected yet. Add your Supabase keys in config.js.</p>';
      return;
    }
    const { data, error } = await db.from("products").select("*")
      .eq("visible", true).order("created_at", { ascending: false });
    if (error) {
      $("grid").innerHTML = `<p class="empty">Could not load products: ${esc(error.message)}</p>`;
      return;
    }
    PRODUCTS = data;
    const best = Math.max(0, ...PRODUCTS.map(savePct));
    $("stats").innerHTML = `<span>${PRODUCTS.length} products</span>` +
      (best ? `<span>Save up to ${best}%</span>` : "");
    const categories = [...new Set(PRODUCTS.map(p => p.category).filter(Boolean))].sort();
    $("chips").hidden = !categories.length;
    $("chips").innerHTML = ["", ...categories].map(c =>
      `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === category}">${c ? esc(c) : "All"}</button>`).join("");
    render();
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const items = PRODUCTS.filter(p =>
      (!category || p.category === category) &&
      (!q || (p.name + " " + (p.note || "")).toLowerCase().includes(q)));

    $("count").textContent = items.length === 1 ? "1 product" : items.length + " products";
    $("grid").innerHTML = items.length ? items.map(p => {
      const photos = photosOf(p);
      const save = savePct(p);
      return `<article class="card" data-id="${p.id}">
        <button type="button" class="media" aria-label="View ${esc(p.name)}">
          <img src="${esc(photos[0]?.url || PLACEHOLDER)}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER">
          ${save >= 5 ? `<span class="tag">-${save}%</span>` : ""}
          ${photos.length > 1 ? `<span class="pics">${photos.length} photos</span>` : ""}
        </button>
        <div class="body">
          ${p.category ? `<div class="cat">${esc(p.category)}</div>` : ""}
          <div class="name">${esc(p.name)}</div>
          ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
          <div class="price-row">
            <span class="price">${fmt(p.price)}</span>
            ${save ? `<span class="was">${fmt(p.retail_price)}</span>` : ""}
          </div>
          ${retailLink(p)}
        </div>
      </article>`;
    }).join("") : '<p class="empty">No products found.</p>';
  }

  $("search").addEventListener("input", render);
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    category = b.dataset.cat;
    $("chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });

  // Open the detail view when a card is tapped (but let the retail link work normally).
  $("grid").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const card = e.target.closest(".card");
    if (card) openView(PRODUCTS.find(p => p.id === card.dataset.id));
  });

  const dlg = $("viewDialog");
  function openView(p) {
    const photos = photosOf(p);
    const urls = photos.length ? photos.map(ph => ph.url) : [PLACEHOLDER];
    const save = savePct(p);
    $("slides").innerHTML = urls.map((u, i) =>
      `<img src="${esc(u)}" alt="${esc(p.name)} photo ${i + 1}" onerror="this.onerror=null;this.src=PLACEHOLDER">`).join("");
    $("dots").innerHTML = urls.length > 1 ? urls.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("") : "";
    $("viewBody").innerHTML = `
      ${p.category ? `<div class="cat">${esc(p.category)}</div>` : ""}
      <div class="name">${esc(p.name)}</div>
      <div class="price-row">
        <span class="price">${fmt(p.price)}</span>
        ${save ? `<span class="was">${fmt(p.retail_price)}</span><span class="tag" style="position:static">-${save}%</span>` : ""}
      </div>
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
      ${retailLink(p)}`;
    dlg.showModal();
    $("slides").scrollLeft = 0;
    updateNav();
  }

  function slideIndex() {
    const s = $("slides");
    return Math.round(s.scrollLeft / (s.clientWidth || 1));
  }
  function updateNav() {
    const count = $("slides").children.length, i = slideIndex();
    $("prev").hidden = count < 2 || i === 0;
    $("next").hidden = count < 2 || i >= count - 1;
    [...$("dots").children].forEach((d, n) => d.classList.toggle("on", n === i));
  }
  $("slides").addEventListener("scroll", updateNav, { passive: true });
  $("prev").addEventListener("click", () => $("slides").scrollBy({ left: -$("slides").clientWidth }));
  $("next").addEventListener("click", () => $("slides").scrollBy({ left: $("slides").clientWidth }));
  $("closeView").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  load();
</script>
</body>
</html>
